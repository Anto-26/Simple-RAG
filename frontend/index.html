<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Enterprise RAG</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <h1>Enterprise RAG</h1>

    <section class="card">
      <h2>1. Upload a document</h2>
      <input type="file" id="fileInput" accept=".pdf,.txt">
      <button id="uploadBtn">Upload &amp; Process</button>
      <p id="uploadStatus" class="status"></p>
    </section>

    <section class="card">
      <h2>2. Ask a question</h2>
      <div class="ask-row">
        <input type="text" id="questionInput" placeholder="Ask a question about the document" disabled>
        <button id="askBtn" disabled>Ask</button>
      </div>
      <p id="answer" class="answer"></p>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
